<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Lightgate">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ABC4FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ABC4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ABC4FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ABC4FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ABC4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="#0B1220"/>
  <!-- gate: rows of dark bars with one illuminated column -->
  <g>
    <ellipse cx="600" cy="150" rx="340" ry="150" fill="url(#halo)"/>
    <g fill="#1E293B">
      <rect x="120" y="60" width="14" height="180" rx="7"/>
      <rect x="190" y="80" width="14" height="140" rx="7"/>
      <rect x="260" y="50" width="14" height="200" rx="7"/>
      <rect x="330" y="90" width="14" height="120" rx="7"/>
      <rect x="400" y="65" width="14" height="170" rx="7"/>
      <rect x="470" y="85" width="14" height="130" rx="7"/>
      <rect x="716" y="85" width="14" height="130" rx="7"/>
      <rect x="786" y="65" width="14" height="170" rx="7"/>
      <rect x="856" y="90" width="14" height="120" rx="7"/>
      <rect x="926" y="50" width="14" height="200" rx="7"/>
      <rect x="996" y="80" width="14" height="140" rx="7"/>
      <rect x="1066" y="60" width="14" height="180" rx="7"/>
    </g>
    <rect x="540" y="30" width="10" height="240" rx="5" fill="url(#glow)"/>
    <rect x="650" y="30" width="10" height="240" rx="5" fill="url(#glow)"/>
    <rect x="593" y="18" width="14" height="264" rx="7" fill="#ABC4FF"/>
  </g>
  <text x="600" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="14" fill="#F1F5F9">LIGHTGATE</text>
  <text x="600" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" letter-spacing="6" fill="#94A3B8">MAKE MARKETS LEGIBLE</text>
</svg>
